[project]
name = "bukkapay"
version = "2.0.0"
description = "BukkaPay FastAPI backend — wallet, payments, rent, merchants, savings groups"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.30.0",
    "alembic>=1.13.3",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.2",
    "arq>=0.26.0",
    "redis>=5.1.0",
    "bcrypt>=4.2.0",
    "webauthn>=2.5.0",
    "stripe>=11.1.0",
    "httpx>=0.27.2",
    "reportlab>=4.2.5",
    "structlog>=24.4.0",
    "python-multipart>=0.0.12",
    "orjson>=3.10.7",
    "python-slugify>=8.0.4",
    "supabase>=2.9.0",
    "google-auth>=2.36.0",
    "pyjwt[crypto]>=2.8.0",
    "pywebpush>=2.0.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "fakeredis>=2.26.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
# Explicit, so CI doesn't change behaviour when ruff's defaults change:
# real errors (pyflakes, syntax/indentation, imports) + import order.
select = ["E4", "E7", "E9", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["I001"]
"tests/*" = ["E402", "E731", "E741"]
"scripts/*" = ["E402"]
"app/api/router.py" = ["E402"]  # admin routers imported after the public router is built
"app/services/claim_payment_service.py" = ["E731"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
