services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: bukkapay
      POSTGRES_PASSWORD: bukkapay
      POSTGRES_DB: bukkapay
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bukkapay"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    command: uvicorn server:app --host 0.0.0.0 --port 5000 --reload
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgresql://bukkapay:bukkapay@postgres:5432/bukkapay
      REDIS_URL: redis://redis:6379/0
      ENV: development
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: .
    command: arq worker.WorkerSettings
    environment:
      DATABASE_URL: postgresql://bukkapay:bukkapay@postgres:5432/bukkapay
      REDIS_URL: redis://redis:6379/0
      ENV: development
    volumes:
      - .:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pg_data:
