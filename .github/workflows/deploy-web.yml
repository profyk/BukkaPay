name: Deploy website and merchant app to Vercel

# website  → www.bukkapay.com      (Vercel project id: secret VERCEL_PROJECT_ID_WEBSITE)
# merchant → merchant.bukkapay.com (Vercel project id: secret VERCEL_PROJECT_ID_MERCHANT)
# Pull requests get a preview URL; main deploys to production.
# Content changes made in the admin app need no deploy — the site refreshes itself.

on:
  push:
    branches: [main]
    paths:
      - "apps/website/**"
      - "apps/merchant/**"
      - ".github/workflows/deploy-web.yml"
  pull_request:
    paths:
      - "apps/website/**"
      - "apps/merchant/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-web-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.pick.outputs.apps }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: pick
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo 'apps=["website","merchant"]' >> "$GITHUB_OUTPUT"; exit 0
          fi
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          changed=$(git diff --name-only "$base" "${{ github.sha }}" 2>/dev/null || echo "apps/website/ apps/merchant/")
          apps=()
          echo "$changed" | grep -q '^apps/website/\|deploy-web.yml' && apps+=('"website"')
          echo "$changed" | grep -q '^apps/merchant/\|deploy-web.yml' && apps+=('"merchant"')
          echo "apps=[$(IFS=,; echo "${apps[*]}")]" >> "$GITHUB_OUTPUT"

  deploy:
    needs: changes
    if: needs.changes.outputs.apps != '[]'
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'pull_request' && 'preview' || 'production' }}
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJson(needs.changes.outputs.apps) }}
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ matrix.app == 'website' && secrets.VERCEL_PROJECT_ID_WEBSITE || secrets.VERCEL_PROJECT_ID_MERCHANT }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v7

      - name: Check deploy credentials
        id: creds
        run: |
          if [ -z "$VERCEL_TOKEN" ] || [ -z "$VERCEL_ORG_ID" ] || [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "::warning::Vercel secrets for ${{ matrix.app }} are not set — skipping deploy (see docs/deployment.md)."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.creds.outputs.ok == 'true'
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/${{ matrix.app }}/package-lock.json

      - name: Install
        if: steps.creds.outputs.ok == 'true'
        run: npm ci

      - name: Type-check
        if: steps.creds.outputs.ok == 'true'
        run: npm run typecheck

      - name: Pull Vercel settings and env
        if: steps.creds.outputs.ok == 'true'
        run: npx vercel@39 pull --yes --environment=${{ github.event_name == 'pull_request' && 'preview' || 'production' }} --token="$VERCEL_TOKEN"

      - name: Build
        if: steps.creds.outputs.ok == 'true'
        run: npx vercel@39 build ${{ github.event_name != 'pull_request' && '--prod' || '' }} --token="$VERCEL_TOKEN"

      - name: Deploy
        if: steps.creds.outputs.ok == 'true'
        id: deploy
        run: |
          url=$(npx vercel@39 deploy --prebuilt ${{ github.event_name != 'pull_request' && '--prod' || '' }} --token="$VERCEL_TOKEN")
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "### ${{ matrix.app }} deployed: $url" >> "$GITHUB_STEP_SUMMARY"

      - name: Smoke test
        if: steps.creds.outputs.ok == 'true' && github.event_name != 'pull_request'
        run: |
          url="${{ steps.deploy.outputs.url }}"
          for path in /; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$url$path")
            echo "$path → $code"
            [ "$code" = "200" ] || { echo "::error::$path returned $code"; exit 1; }
          done
