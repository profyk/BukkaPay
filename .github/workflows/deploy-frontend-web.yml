name: Build and Deploy Customer Web to Vercel

# Production for app.bukkapay.com is built by Vercel's Git integration from
# `main` (with the env vars set in Vercel). This workflow is a manual fallback
# only, so the two never race to overwrite each other.
on:
  workflow_dispatch:

defaults:
  run:
    working-directory: apps/customer

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Build Expo web export
        run: npx expo export --platform web --clear
        env:
          EXPO_NO_TELEMETRY: '1'
          CI: '1'
          # Public OAuth client IDs (GitHub → Settings → Variables), baked into the web bundle.
          EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID: ${{ vars.EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID }}
          EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID: ${{ vars.EXPO_PUBLIC_GOOGLE_IOS_CLIENT_ID }}
          EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID: ${{ vars.EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID }}
          EXPO_PUBLIC_APPLE_SERVICES_ID: ${{ vars.EXPO_PUBLIC_APPLE_SERVICES_ID }}

      - name: Package for Vercel prebuilt deploy
        run: |
          mkdir -p .vercel/output/static
          cp -r dist/. .vercel/output/static/

          # Vercel's static file serving doesn't resolve paths containing
          # literal [brackets] (Expo's own dynamic-route file naming), even
          # with a routes rewrite pointing at them -- copy each dynamic
          # route's prerendered HTML to a bracket-free filename that the
          # routes below can actually reach.
          cp ".vercel/output/static/pay/[linkId].html" ".vercel/output/static/pay/_dynamic.html"
          cp ".vercel/output/static/pay-rent/[linkCode].html" ".vercel/output/static/pay-rent/_dynamic.html"
          cp ".vercel/output/static/claim/[id].html" ".vercel/output/static/claim/_dynamic.html"
          cp ".vercel/output/static/merchant-pay/[paymentLink].html" ".vercel/output/static/merchant-pay/_dynamic.html"
          cp ".vercel/output/static/staff-invite/[code].html" ".vercel/output/static/staff-invite/_dynamic.html"

          cat > .vercel/output/config.json << 'EOF'
          {
            "version": 3,
            "routes": [
              { "handle": "filesystem" },
              { "src": "^/pay/[^/]+$", "dest": "/pay/_dynamic", "check": true },
              { "src": "^/pay-rent/[^/]+$", "dest": "/pay-rent/_dynamic", "check": true },
              { "src": "^/claim/[^/]+$", "dest": "/claim/_dynamic", "check": true },
              { "src": "^/merchant-pay/[^/]+$", "dest": "/merchant-pay/_dynamic", "check": true },
              { "src": "^/staff-invite/[^/]+$", "dest": "/staff-invite/_dynamic", "check": true },
              { "src": "/(.*)", "dest": "/" }
            ]
          }
          EOF
          cat > .vercel/project.json << EOF
          {
            "projectId": "${{ secrets.VERCEL_PROJECT_ID }}",
            "orgId": "${{ secrets.VERCEL_ORG_ID }}"
          }
          EOF

      - name: Deploy to Vercel
        run: npx vercel deploy --prebuilt --prod --yes --token=${{ secrets.VERCEL_TOKEN }}
