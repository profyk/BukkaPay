name: CI and security hardening

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write
  actions: read          # code-scanning upload reads the workflow run
  pull-requests: read    # gitleaks lists the PR's commits

# A newer push to the same branch/PR supersedes the running checks.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-checks:
    name: Backend quality gates
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: bukkapay
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d bukkapay"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    env:
      ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bukkapay
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: test-secret-key-change-me
      ADMIN_API_KEY: test-admin-key
      ALLOWED_ORIGINS: http://localhost:3000,http://localhost:8081
      APP_URL: http://localhost:8081
      API_BASE_URL: http://localhost:5000
      WEBAUTHN_RP_ID: localhost
      WEBAUTHN_ORIGIN: http://localhost:5000
      SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://placeholder-project.supabase.co' }}
      SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || 'placeholder-anon-key' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
        working-directory: backend

      - name: Lint backend
        run: ruff check .
        working-directory: backend

      - name: Type-check backend
        run: mypy app
        working-directory: backend
        continue-on-error: true

      - name: Run backend tests
        run: pytest -q
        working-directory: backend

  app-build-checks:
    name: Admin, customer, merchant, website and pay app checks
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Installs are lockfile-exact so CI builds what was reviewed.
          - app: admin
            install: corepack enable && pnpm install --frozen-lockfile
            build: pnpm run typecheck && pnpm run build
            lock: apps/admin/pnpm-lock.yaml
          - app: customer
            install: npm install --legacy-peer-deps  # lockfile is regenerated by Expo upgrades; npm ci once it settles
            build: npx tsc --noEmit -p . && npm run build
            lock: apps/customer/package-lock.json
          - app: merchant
            install: npm ci
            build: npm run typecheck && npm run build
            lock: apps/merchant/package-lock.json
          - app: website
            install: npm ci
            build: npm run typecheck && npm run build
            lock: apps/website/package-lock.json
          - app: pay
            install: npm ci
            build: npm run typecheck && npm run build
            lock: apps/pay/package-lock.json
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Cache dependencies
        uses: actions/cache@v6
        with:
          path: |
            ~/.npm
            ~/.local/share/pnpm/store
          key: ${{ runner.os }}-${{ matrix.app }}-${{ hashFiles(matrix.lock) }}
          restore-keys: ${{ runner.os }}-${{ matrix.app }}-

      - name: Install app dependencies
        run: ${{ matrix.install }}

      - name: Type-check and build
        run: ${{ matrix.build }}
        env:
          CI: true
          EXPO_NO_TELEMETRY: 1
          NEXT_PUBLIC_API_URL: https://api.bukkapay.com
          NEXT_TELEMETRY_DISABLED: 1
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL || 'https://placeholder-project.supabase.co' }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY || 'placeholder-anon-key' }}

  dependency-scan:
    name: Dependency security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          format: 'sarif'
          output: 'trivy-results.sarif'
          ignore-unfixed: true

      - name: Upload Trivy report
        # Needs GitHub code scanning (Advanced Security) on this private repo;
        # the gate below still fails the build on critical findings.
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Fail on critical vulnerabilities with a fix
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: 'fs'
          format: 'table'
          severity: 'CRITICAL'
          ignore-unfixed: true
          exit-code: '1'

  secret-scan:
    name: Secret detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Detect secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
