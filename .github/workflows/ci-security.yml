name: CI and security hardening

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write

jobs:
  backend-checks:
    name: Backend quality gates
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: bukkapay
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d bukkapay"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
    env:
      ENV: test
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/bukkapay
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: test-secret-key-change-me
      ADMIN_API_KEY: test-admin-key
      ALLOWED_ORIGINS: http://localhost:3000,http://localhost:8081
      APP_URL: http://localhost:8081
      API_BASE_URL: http://localhost:5000
      WEBAUTHN_RP_ID: localhost
      WEBAUTHN_ORIGIN: http://localhost:5000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
        working-directory: backend

      - name: Lint backend
        run: ruff check .
        working-directory: backend

      - name: Type-check backend
        run: mypy app
        working-directory: backend
        continue-on-error: true

      - name: Run backend tests
        run: pytest -q
        working-directory: backend

  frontend-checks:
    name: Frontend build gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        run: npm install --legacy-peer-deps

      - name: Type-check frontend
        run: npx tsc --noEmit

      - name: Build frontend web bundle
        run: npm run build
        env:
          CI: true
          EXPO_NO_TELEMETRY: 1

  dependency-scan:
    name: Dependency security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: 'fs'
          format: 'sarif'
          output: 'trivy-results.sarif'
          ignore-unfixed: true

      - name: Upload Trivy report
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

  secret-scan:
    name: Secret detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
