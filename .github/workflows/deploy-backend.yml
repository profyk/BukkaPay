name: Deploy backend to Railway

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy API and worker
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7

      - name: Install Railway CLI
        run: npm i -g @railway/cli

      - name: Deploy API service
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        # The Railway services' root directory is `backend`, so upload the repo root.
        run: railway up --service="${{ secrets.RAILWAY_API_SERVICE_NAME || 'BukkaPay-Backend' }}" --ci

      - name: Deploy worker service
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: railway up --service="${{ secrets.RAILWAY_WORKER_SERVICE_NAME || 'worker' }}" --ci
