  - package-ecosystem: "npm"
    directory: "/apps/admin"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/apps/website"
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directory: "/apps/merchant"
    schedule:
      interval: "weekly"
