kind = "web"
previewPath = "/"
title = "BukkaPay Admin Panel"
version = "1.0.0"
id = "artifacts/bukkapay-admin"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
localPort = 22360
name = "web"
paths = ["/"]

[services.development]
run = "pnpm --filter @workspace/bukkapay-admin run dev"

[services.env]
PORT = "22360"
BASE_PATH = "/"

[services.production]
build = ["pnpm", "--filter", "@workspace/bukkapay-admin", "run", "build"]
publicDir = "artifacts/bukkapay-admin/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"
